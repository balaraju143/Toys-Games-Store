<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>404 | Stackly Toys & Games</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Material Icons -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

    <!-- GSAP -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

    <link rel="stylesheet" href="css/404.css">
</head>

<body>

    <main class="stackly-404-page">

        <!-- Background Decorations -->
        <div class="stackly-404-glow stackly-glow-one"></div>
        <div class="stackly-404-glow stackly-glow-two"></div>

        <div class="stackly-404-dots"></div>


        <!-- 404 CARD -->
        <section class="stackly-404-card">

            <!-- Logo -->
            <a href="index.html" class="stackly-404-logo">
                <img src="assets/green-stackly-logo.webp"
                     alt="Stackly Toys & Games">
            </a>


            <!-- 404 Visual -->
            <div class="stackly-404-visual">

                <span class="stackly-404-number">4</span>

                <div class="stackly-404-toy">
                    <span class="material-icons">
                        extension
                    </span>
                </div>

                <span class="stackly-404-number">4</span>

            </div>


            <!-- Content -->
            <div class="stackly-404-content">

                <span class="stackly-404-label">
                    <span class="material-icons">toys</span>
                    OOPS! SOMETHING WENT WRONG
                </span>

                <h1>
                    Page Not
                    <span>Found</span>
                </h1>

                <p>
                    Looks like this page has gone missing from our
                    toy box. Let's get you back to the Stackly
                    collection and continue exploring.
                </p>

            </div>


            <!-- Buttons -->
            <div class="stackly-404-buttons">

                <a href="index.html" class="stackly-404-primary">
                    <span class="material-icons">home</span>
                    Back to Home
                </a>

                <button type="button"
                        class="stackly-404-secondary"
                        onclick="history.back()">
                    Previous Page
                </button>

            </div>


            <!-- Bottom Text -->
            <div class="stackly-404-bottom">

                <span class="material-icons">sports_esports</span>

                <span>
                    Stackly Toys & Games
                </span>

                <span class="stackly-404-dot">•</span>

                <span>
                    Play. Discover. Enjoy.
                </span>

            </div>

        </section>

    </main>


    <script src="js/404.js"></script>

</body>
</html>
